name: rhythm Go! Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore rhythm-Go.csproj

      - name: Publish Windows EXE
        run: dotnet publish rhythm-Go.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-Go-Windows-x64
          path: output/rhythm-Go.exe
          if-no-files-found: error
          retention-days: 14
